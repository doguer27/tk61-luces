<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>TK61 Luces</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #13151b; color: #e8eaf0; font: 14.5px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  body { -webkit-app-region: drag; display: flex; flex-direction: column; padding: 20px 20px 18px; border: 1px solid #2c3140;
    background: radial-gradient(420px 160px at 0 0, #00d5ff24, transparent 70%), radial-gradient(380px 180px at 100% 100%, #7a5cff1f, transparent 70%), #13151b; }
  .top { display: flex; gap: 14px; align-items: center; }
  img { width: 46px; height: 46px; flex: none; }
  h1 { margin: 0; font-size: 16.5px; font-weight: 650; }
  h1 span { color: #00d5ff; }
  .sub { color: #8b91a1; font-size: 12.5px; margin-top: 1px; }
  p { margin: 14px 0 0; color: #b9bfcd; font-size: 13.5px; flex: 1; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; }
  button { -webkit-app-region: no-drag; font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 9px; border: 1px solid #262a35; background: #191c24; color: #e8eaf0; cursor: pointer; }
  button:hover { border-color: #3a4050; }
  button.primary { background: #00d5ff; border-color: #00d5ff; color: #06121a; font-weight: 700; }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
  <div class="top">
    <img src="icono.png" alt="">
    <div>
      <h1>Nueva versión <span id="v"></span></h1>
      <div class="sub">TK61 Luces · ya está descargada</div>
    </div>
  </div>
  <p id="txt">Instalarla tarda unos segundos y la app se vuelve a abrir sola. Tus perfiles y ajustes no se tocan.</p>
  <div class="actions">
    <button id="later">Más tarde</button>
    <button class="primary" id="now">Instalar ahora</button>
  </div>
<script>
'use strict';
document.getElementById('v').textContent = new URLSearchParams(location.search).get('v') || '';
document.getElementById('later').onclick = () => window.tk61.call('update-later');
document.getElementById('now').onclick = e => {
  e.target.disabled = true; document.getElementById('later').disabled = true;
  e.target.textContent = 'Instalando…';
  window.tk61.call('update-install');
};
</script>
</body>
</html>
